[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medcomply"
version = "0.1.0"
description = "Research prototype for controlled-medication shipment compliance"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "web3>=7,<8", "langchain>=1,<2",
  "langgraph>=1,<2", "reportlab>=4,<5", "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "slither-analyzer>=0.11,<1", "playwright>=1.64,<2"]

[tool.setuptools]
packages = ["medcomply", "tools"]
package-dir = {medcomply = "src/medcomply", tools = "tools"}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: requires the explicitly running local service fixture"]

[tool.setuptools.package-data]
medcomply = ["web/*.html", "web/*.js", "web/*.css"]
